# Advisories against this crate's lockfile that have no fixed release to move to, each with the reason it
# is accepted. Every entry expires, so it is looked at again rather than kept by habit; the list and how
# it was checked are in docs/security/supply-chain.md.

# quick-xml: quadratic time on duplicate attributes, unbounded allocation in NsReader. Two copies, both
# reached only through Typst features the renderer cannot produce: citationberg (bibliographies and
# citations) and plist (syntect's code highlighting). typst_gen.rs writes user text through escape(),
# which neutralises `#`, `@` and the backtick, so a document cannot call #bibliography, cite, or open a
# raw block. citationberg 0.7.0, the latest, still requires quick-xml ^0.38.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
ignoreUntil = 2027-04-03
reason = "quick-xml via citationberg and plist; the renderer never emits bibliography, citations or raw blocks, and the latest citationberg still pins quick-xml ^0.38"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
ignoreUntil = 2027-04-03
reason = "quick-xml via citationberg and plist; the renderer never emits bibliography, citations or raw blocks, and the latest citationberg still pins quick-xml ^0.38"

