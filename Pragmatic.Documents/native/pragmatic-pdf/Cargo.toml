[package]
name = "pragmatic-pdf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native PDF renderer — DocumentModel JSON → Typst → PDF. C ABI exports."

[lib]
name = "pragmatic_pdf_native"
crate-type = ["cdylib"]

[dependencies]
pragmatic-core = { path = "../../../shared/native/pragmatic-core" }
typst = "0.13"
typst-pdf = "0.13"
# Only the system font search. The default features add package downloads (ureq, native-tls, openssl,
# tar): an HTTP client this renderer never calls, and the dependency most of its advisories came from.
typst-kit = { version = "0.13", default-features = false, features = ["fonts"] }
typst-library = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ecow = "0.2"
base64 = "0.22"
lopdf = "0.42"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
