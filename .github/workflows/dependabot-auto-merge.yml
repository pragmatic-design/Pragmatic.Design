name: Dependabot auto-merge

# A Dependabot pull request waited for somebody to merge it: astro 7.3.5 → 7.3.6 sat green for a day.
# A patch or minor update now merges itself, by squash, once every check the main ruleset requires is
# green — auto-merge waits on them, so nothing merges red. A major update is an upgrade done on purpose:
# it stays open, with a comment saying so.
#
# pull_request_target, because a Dependabot pull_request run gets a read-only token and enabling
# auto-merge needs write. That trigger runs with the base branch's workflow and a writing token, so this
# job never checks out or runs anything from the pull request: it reads Dependabot's metadata and calls
# the API, nothing else.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the highest change in the pull request, so a group with one major in it is a major.
      - name: Patch or minor — merge when green
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Major — leave it for the owner
        if: steps.metadata.outputs.update-type == 'version-update:semver-major' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr comment "$PR_URL" --body
          "A major update does not merge itself: it is an upgrade made on purpose, reviewed and merged by a
          maintainer. Patch and minor updates are merged automatically once every required check is green."
