name: Commit Messages

# The same rules the commit-msg hook applies locally (scripts/commit-message-check.mjs), for a
# contributor who never enabled the hook. A pull request is merged by squash with its title and
# description as the message, so those become the commit on main: they are checked as well as every
# commit in the pull request.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  # The merge queue needs this required check on its merge-group commit too. There is nothing new to check
  # there: the squash message is the pull request's title and description, and its commits, both checked
  # on the pull request, so the steps below run on pull_request only and the job passes in the queue.
  merge_group:

permissions:
  contents: read

jobs:
  messages:
    name: Check commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Pull request title and description (the squash commit)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: node scripts/commit-message-check.mjs --text "$TITLE"$'\n\n'"$BODY"

      - name: Commits in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-message-check.mjs --range "$BASE..$HEAD"
