name: CI

# The gate itself lives in scripts/check.mjs, and CI runs exactly that. When the gate was spelled out
# here instead, it drifted from what anyone ran locally: this workflow built without --warnaserror (so
# 14 errors reached main while the Pre-PR checklist claimed the flag was required), and two jobs pointed
# at solution files that do not exist — harmless-looking because they were gated on `pull_request`,
# which a trunk-based flow never produces. `--tier verify` now fails on a path CI names but the repo
# does not have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:     # the merge queue runs the gate on the pull request as it will land (#197)
  workflow_call:   # release.yml runs the gate before it publishes
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  # The native PDF and Imaging libraries are not committed (#159). Each is uploaded under its source hash
  # by its own workflow, so this asks whether any run has built the source this commit has; when none has
  # (a change to the crate, or an artifact past its 90 days), the two jobs below build it in this run,
  # before the gate and the shards download it. Downloading rather than building in every job keeps the
  # gate's time, which is why the jobs that test do not install a Rust toolchain.
  native:
    name: Native libraries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # the artifacts of other runs
    outputs:
      pdf: ${{ steps.probe.outputs.pdf }}
      imaging: ${{ steps.probe.outputs.imaging }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # linux-x64 only: the gate and the shards run on Linux. The packages' other RIDs are pack-validate's.
      - name: Is there a build of this source?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.mjs --probe --rid linux-x64

  pdf-native:
    needs: native
    if: needs.native.outputs.pdf == 'missing'
    uses: ./.github/workflows/pdf-native.yml

  imaging-native:
    needs: native
    if: needs.native.outputs.imaging == 'missing'
    uses: ./.github/workflows/imaging-native.yml

  # Clean build with --warnaserror, plus every suite that needs no container.
  # Clean is not optional: an incremental build does not re-evaluate up-to-date projects, so
  # --warnaserror over one reports 0 errors on sources that clean-build with 14.
  gate:
    name: Gate (clean build + hermetic tests)
    needs: [native, pdf-native, imaging-native]
    # A build that was not needed is skipped, and a job after a skipped one is skipped too unless it says
    # otherwise. Skipped would also read as passed to the branch rules, so the gate runs whatever the
    # native jobs did, and its first step fails when one of them did not succeed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read     # the native libraries, from the run that built them

    steps:
      - name: The native libraries were built where they had to be
        if: needs.native.result != 'success' || needs.pdf-native.result == 'failure' || needs.imaging-native.result == 'failure' || needs.pdf-native.result == 'cancelled' || needs.imaging-native.result == 'cancelled'
        run: |
          echo "::error::native: ${{ needs.native.result }}, pdf: ${{ needs.pdf-native.result }}, imaging: ${{ needs.imaging-native.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Before anything reads runtimes/: the gate's source checks refuse a run without this machine's.
      - name: Native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.mjs --rid linux-x64

      # A pull request or merge group that changes only Markdown nothing builds runs the gate's
      # source-only checks (`--tier docs`) and nothing that compiles (#199, scripts/ci-paths.mjs). Any
      # other event, and any doubt, is `full`. Decided in each job rather than by skipping jobs: a job
      # skipped whole reports a check of its own name, and for the container shards' matrix that is not
      # the three checks the branch rules wait for.
      - name: Classify the change
        id: change
        run: node scripts/ci-paths.mjs ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha) || '' }}

      - name: Setup .NET
        if: steps.change.outputs.scope != 'docs'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.change.outputs.scope != 'docs'
        run: dotnet restore Pragmatic.Design.slnx --locked-mode

      # The SBOM and the clean vulnerability verdict of the newest green run. supply-chain.mjs decides
      # whether they stand: the SBOM while the dependency graph is the same, the verdict while the graph
      # is the same AND it is less than 12 hours old. Without this every run regenerated both, about
      # three minutes of the gate (#197). Saved under this run's id, so a newer verdict is never kept
      # out by an older key, and restored by prefix, so the newest one is what the next run sees.
      - name: Restore the supply-chain verdict
        if: steps.change.outputs.scope != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/supply-chain.cache.json
            artifacts/sbom
          key: supply-chain-${{ github.run_id }}
          restore-keys: supply-chain-

      - name: Gate
        run: node scripts/check.mjs --tier ${{ steps.change.outputs.scope == 'docs' && 'docs' || 'full' }} --keep-going

      # The log prints one capped line per failed test; the record beside it holds the message and the
      # stack. A failure that does not reproduce on a re-run is only diagnosable from that record.
      - name: Keep the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-failures-full
          path: artifacts/gate/failures-*.json
          if-no-files-found: ignore
          retention-days: 30

      # The CycloneDX SBOMs the gate just wrote, kept for release.yml to attach to the GitHub Release: it
      # calls this workflow, so the artifact is in its own run. Small, and kept a week.
      - name: Keep the SBOM
        if: steps.change.outputs.scope != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/Pragmatic.*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # The suites that start Testcontainers, run ONE AT A TIME within a job. In parallel on one host they
  # exhaust Docker and fail on container start-up, which reads exactly like a code regression — and on a
  # developer machine it can take the whole host down with it.
  #
  # Three jobs on three runners do not share a Docker, so the suites are split across them
  # (scripts/docker-shards.mjs, balanced by duration), and they start beside the gate instead of after
  # it: `needs: gate` shared nothing, since every job checks out, restores and builds on its own. One job
  # of twenty suites ran ~28 minutes after a gate of 10–17; the run is now the longest of the four jobs.
  # A suite in no shard fails the gate's full tier, so none can stop running here unnoticed.
  #
  # A shard builds its own suites and what they reference, not the solution: the whole build took 4m 51s
  # of a 12m 42s job, for projects no suite of the shard runs (#197). The gate's clean build still compiles
  # all of them. A fourth shard was measured and not added: TimeOff alone is 6m 11s of suites, so it would
  # take the longest shard from about 6m 47s of suites to 6m 11s, a runner for 36 seconds.
  container-suites:
    name: Container suites (${{ matrix.shard }}/3)
    needs: [native, pdf-native, imaging-native]
    if: ${{ !cancelled() }}   # as the gate: run whatever the native jobs did, and fail if one failed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read     # the native libraries, from the run that built them
    strategy:
      # Each shard is its own verdict: one red shard cancelling the others would hide whether they pass.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: The native libraries were built where they had to be
        if: needs.native.result != 'success' || needs.pdf-native.result == 'failure' || needs.imaging-native.result == 'failure' || needs.pdf-native.result == 'cancelled' || needs.imaging-native.result == 'cancelled'
        run: |
          echo "::error::native: ${{ needs.native.result }}, pdf: ${{ needs.pdf-native.result }}, imaging: ${{ needs.imaging-native.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.mjs --rid linux-x64

      # As in the gate job: a Markdown-only change runs no container suite, and the shard reports green
      # under its own name having done nothing else.
      - name: Classify the change
        id: change
        run: node scripts/ci-paths.mjs ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha) || '' }}

      # This job holds the whole build (about 6 GB locally) and the images of fourteen suites at once,
      # SQL Server's the largest. On 2026-09-12 every SQL Server pull came back "No such image" and a
      # Postgres container could not write its init file, in the same run: the shape of a full disk,
      # though nothing in that log measured it. The df lines here and after the suites do.
      - name: Free disk space
        if: steps.change.outputs.scope != 'docs'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup .NET
        if: steps.change.outputs.scope != 'docs'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.change.outputs.scope != 'docs'
        run: dotnet restore Pragmatic.Design.slnx --locked-mode

      - name: Container suites
        if: steps.change.outputs.scope != 'docs'
        run: node scripts/check.mjs --tier docker --shard ${{ matrix.shard }}/3 --keep-going

      - name: Keep the failure record
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-failures-docker-${{ matrix.shard }}
          path: artifacts/gate/failures-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Disk after the suites
        if: always() && steps.change.outputs.scope != 'docs'
        run: |
          df -h /
          docker system df
