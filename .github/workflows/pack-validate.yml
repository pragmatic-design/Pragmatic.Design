name: Pack Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:   # release.yml publishes the packages this job packs and validates
    inputs:
      build-native:
        description: Build the native libraries in this run, and pack only those (a release)
        type: boolean
        default: false

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  # The packages carry the native libraries of every RID, and they are not committed (#159). As in ci.yml:
  # ask whether a run has built this source, build it here when none has, then download it. A release
  # (build-native) ships only libraries its own run built, from the commit it releases.
  native:
    name: Native libraries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # the artifacts of other runs
    outputs:
      pdf: ${{ steps.probe.outputs.pdf }}
      imaging: ${{ steps.probe.outputs.imaging }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # A release asks about its own run only: a build an earlier run made does not count, and one the
      # release's gate already made in this run is not made twice (a second upload of a name fails).
      - name: Is there a build of this source?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.mjs --probe --rid all ${{ inputs.build-native && format('--run-id {0}', github.run_id) || '' }}

  pdf-native:
    needs: native
    if: needs.native.outputs.pdf == 'missing'
    uses: ./.github/workflows/pdf-native.yml

  imaging-native:
    needs: native
    if: needs.native.outputs.imaging == 'missing'
    uses: ./.github/workflows/imaging-native.yml

  pack:
    name: Pack & Validate
    needs: [native, pdf-native, imaging-native]
    # As in ci.yml: skipped would read as passed, so this runs whatever the native jobs did and fails first.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read     # the native libraries, from the run that built them

    steps:
      - name: The native libraries were built where they had to be
        if: needs.native.result != 'success' || needs.pdf-native.result == 'failure' || needs.imaging-native.result == 'failure' || needs.pdf-native.result == 'cancelled' || needs.imaging-native.result == 'cancelled'
        run: |
          echo "::error::native: ${{ needs.native.result }}, pdf: ${{ needs.pdf-native.result }}, imaging: ${{ needs.imaging-native.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # MinVer needs full history for version resolution

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Every RID, before the build: the projects copy and pack whichever of them exist. A release takes
      # only what this run built.
      - name: Native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.mjs --rid all ${{ inputs.build-native && format('--run-id {0}', github.run_id) || '' }}

      # A Markdown-only change packs nothing (#199, scripts/ci-paths.mjs): the Markdown that is packed, a
      # module's README and docs/ and the root README, classifies as `full`, so this job still validates
      # it whenever it changes.
      - name: Classify the change
        id: change
        run: node scripts/ci-paths.mjs ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha) || '' }}

      - name: Setup .NET
        if: steps.change.outputs.scope != 'docs'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.change.outputs.scope != 'docs'
        run: dotnet restore Pragmatic.Design.slnx --locked-mode

      # Build, then pack what was built — the order scripts/publish-local.mjs uses. Runtime libraries set
      # GeneratePackageOnBuild (Directory.Build.props), and with it `dotnet pack` does not run the build
      # itself: on a fresh checkout it packed binaries that did not exist yet, and failed with NU5026 on
      # every package.
      - name: Build (Release)
        if: steps.change.outputs.scope != 'docs'
        run: dotnet build Pragmatic.Design.slnx --no-restore --configuration Release

      - name: Pack (Release)
        if: steps.change.outputs.scope != 'docs'
        run: dotnet pack Pragmatic.Design.slnx --no-build --configuration Release --output ./artifacts

      - name: Validate package metadata
        if: steps.change.outputs.scope != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          cd ./artifacts
          fail=0
          for pkg in *.nupkg; do
            # Skip symbol packages
            if [[ "$pkg" == *.symbols.nupkg ]]; then continue; fi
            echo "::group::Validating $pkg"
            unzip -p "$pkg" '*.nuspec' > /tmp/nuspec.xml
            for required in '<license' '<readme>' '<projectUrl>' '<repository' '<copyright>'; do
              if ! grep -q "$required" /tmp/nuspec.xml; then
                echo "::error file=$pkg::Missing required metadata: $required"
                fail=1
              fi
            done
            if ! unzip -l "$pkg" | grep -q "LICENSE"; then
              echo "::error file=$pkg::LICENSE file missing from package"
              fail=1
            fi
            if ! unzip -l "$pkg" | grep -q "README.md"; then
              echo "::error file=$pkg::README.md missing from package"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ $fail -ne 0 ]; then
            echo "::error::One or more packages failed validation"
            exit 1
          fi
          echo "All $(ls *.nupkg | grep -v symbols | wc -l) packages validated"

      - name: List produced packages
        if: steps.change.outputs.scope != 'docs'
        run: ls -la ./artifacts

      - name: Upload packages
        if: steps.change.outputs.scope != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 14
