name: Benchmarks

# Performance gets a signal here and nowhere else: not on every pull request, because the gate stays the
# gate, and a benchmark run takes far longer than one.
#
# Two kinds of result, judged differently (scripts/benchmarks.mjs):
# - allocations are deterministic for a code path, so they hold on a shared runner: a committed baseline
#   per benchmark, and the run fails when one allocates more or has no baseline;
# - times vary by 10-20% between runners, so they are never compared with a stored history: base and
#   head run on this one VM, alternated, and the job summary reports the ratios. They never fail the run.
#
# A/B for a pull request: run this workflow on the branch, with `base` left at main.
#
# On a pull request only the benchmark classes the change reaches run, on both sides (#172): running all
# of them took 2h15m to prove one new class. A change to the harness still runs everything, and the
# nightly run is where every benchmark is measured.

on:
  workflow_dispatch:
    inputs:
      base:
        description: The ref the timings are compared against
        required: true
        default: main
  schedule:
    - cron: '0 3 * * *'   # nightly: main against main, the ratchet and the noise floor of the A/B
  # A change that can reach a benchmark: the harness, a benchmark, a module's source, the shared code or a
  # file every project is built with. Which classes it reaches is the selection's to decide, and a change
  # to a module no benchmark project references runs nothing (#189).
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/benchmarks.yml
      - scripts/benchmarks.mjs
      - scripts/benchmark-selection.mjs
      - benchmarks/**
      - '*/benchmarks/**'
      - '*/src/**'
      - shared/**
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Allocation ratchet + A/B timings
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read     # the native libraries, from the runs that built them

    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base || 'main' }}
          path: base

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: head/global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The native libraries are not committed (#159): each side gets the CI build of its own source, by
      # head's script, which knows where both go. ⚠️ CI builds a changed crate's source in its own run: a
      # pull request that changes one starts this job before that build exists, fails here, and is re-run
      # once its CI has built it. A base on main always has one.
      - name: Native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node head/scripts/fetch-native.mjs --rid linux-x64 --root head
          node head/scripts/fetch-native.mjs --rid linux-x64 --root base

      - name: Run base and head
        run: node head/scripts/benchmarks.mjs ci --head head --base base --out results ${{ github.event_name == 'pull_request' && '--changed-only' || '' }}

      # Uploaded on a red run too: the proposed baseline is how a new or lowered baseline gets committed,
      # copied from this runner rather than typed in from a laptop.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-reports
          path: |
            results/allocation-baseline.proposed.json
            results/**/BenchmarkDotNet.Artifacts/results/
          if-no-files-found: error
