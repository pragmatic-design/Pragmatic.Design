name: Release

# Publishes the packages to nuget.org when a `nuget-v*` tag is pushed. Nothing is built twice and
# nothing is published that did not pass: the gate (ci.yml) runs first, then pack-validate.yml packs and
# checks the packages, and this job pushes exactly the artifact that job uploaded.
#
# No API key is stored. Trusted Publishing exchanges this job's GitHub OIDC token for a nuget.org key
# valid for an hour; the policy on nuget.org names this repository, this file and the `nuget`
# environment, so no other workflow can publish under it.
#
# Every package pushed carries a signed build-provenance attestation (which repository, commit and
# workflow built it). The gate's SBOMs and the attestation's signed bundle are attached to the GitHub
# Release that changelog.yml creates.

on:
  push:
    tags: ['nuget-v*']

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: gate
    uses: ./.github/workflows/pack-validate.yml

  publish:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write       # the nuget.org login, and the Sigstore certificate that signs the attestation
      attestations: write   # storing the attestation with the repository

    steps:
      # global.json only, for setup-dotnet below: the packages come from the artifact, never from a build
      # here. First, because checkout cleans the workspace and would remove anything downloaded before it.
      - name: Checkout the SDK pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: ./artifacts

      # MinVer derives the version from the tag; a package carrying any other version means the tag was
      # not where the build looked for it, and publishing it would ship a number nobody chose.
      - name: Every package carries the tag's version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#nuget-v}"
          wrong=0
          for pkg in ./artifacts/*.nupkg; do
            case "$pkg" in
              *".$version.nupkg") ;;
              *) echo "::error::$pkg does not carry version $version"; wrong=1 ;;
            esac
          done
          [ "$wrong" -eq 0 ]
          echo "$(ls ./artifacts/*.nupkg | wc -l) packages at $version"

      # Before the push, over the exact files pushed. nuget.org then adds its signature inside each
      # package, which changes the file's digest: attest-published.yml attests the packages as served.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./artifacts/*.nupkg

      # The signed bundle of that attestation, for the release, until attest-published.yml replaces it with
      # the bundle for the packages as nuget.org serves them.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet login (OIDC to a temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg beside each .nupkg is pushed with it. --skip-duplicate lets a re-run after a partial
      # failure finish the packages that did not make it, instead of failing on the ones that did.
      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Its own job, so the publishing job never holds a token that can write to the repository.
  sbom:
    name: Attach the SBOM and the provenance to the release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # uploading a release asset

    steps:
      - name: Download the gate's SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ./sbom

      - name: Download the provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: ./provenance

      # changelog.yml creates the release as soon as the tag is pushed; this job runs after the whole gate
      # and the approval, so the release is there. If it is not, fail rather than create a second one.
      # The bundle goes up as .intoto.jsonl, the name under which tools that look for provenance next to a
      # release (OpenSSF Scorecard among them) recognise it.
      - name: Attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#nuget-v}"
          archive="sbom-$version.zip"
          (cd sbom && zip -q -r "../$archive" .)
          bundles=(provenance/*)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::expected one provenance bundle, found ${#bundles[@]}"
            exit 1
          fi
          provenance="provenance-$version.intoto.jsonl"
          cp "${bundles[0]}" "$provenance"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" "$archive" "$provenance" --repo "$GITHUB_REPOSITORY" --clobber
          echo "$(ls sbom | wc -l) SBOMs attached as $archive, provenance as $provenance"
