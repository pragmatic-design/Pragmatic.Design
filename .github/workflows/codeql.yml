name: CodeQL

# Static security analysis of the C# sources and of these workflows. Build mode "none" analyses the
# sources without compiling them: the solution's full build is the gate's job (ci.yml), and doubling it
# here would buy nothing CodeQL needs.
#
# The C# analysis runs on main, weekly and on demand, not on pull requests: it took 15–30 minutes, the
# longest job of nearly every pull request, while the gate and the container suites finish in about 15
# (#197). A finding now surfaces after the merge, in code scanning, rather than before it. The workflow
# analysis takes under a minute and stays on pull requests and in the merge queue.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-csharp:
    name: Analyze (csharp)
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: read lets the CodeQL action read its own workflow run; without it the analysis fails at
    # the end with "Resource not accessible by integration".
    permissions:
      actions: read
      contents: read
      security-events: write   # uploading the results to code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:csharp

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
