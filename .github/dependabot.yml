version: 2

# Versions are pinned centrally (Directory.Packages.props, site/pnpm-lock.yaml, the workflow `uses:`
# lines), so each ecosystem is watched from one place. Updates are grouped per ecosystem: one pull
# request a week to review and run through the gate, rather than one per package.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  # Minor and patch only. A major of Astro, Starlight or TypeScript changes the site's configuration, and
  # bundled together they arrive as one red pull request nobody can merge; a major is an upgrade done on
  # purpose, in its own change.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
