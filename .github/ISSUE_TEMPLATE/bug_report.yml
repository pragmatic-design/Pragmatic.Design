name: Bug Report
description: Report a bug in Pragmatic.Design
labels: ["bug"]
body:
  - type: input
    id: packages
    attributes:
      label: Packages and version
      description: The Pragmatic packages involved, with the version you use.
      placeholder: "Pragmatic.Persistence.EFCore 1.0.0-alpha.1, Pragmatic.SourceGenerator 1.0.0-alpha.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK Version
      description: Output of `dotnet --version`
      placeholder: "10.0.100"
    validations:
      required: true
