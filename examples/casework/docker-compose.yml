# What Casework needs to run: one PostgreSQL and one RabbitMQ. `docker compose up -d --wait`, then
# `dotnet run --project src/Casework.Intake.Host` and `dotnet run --project src/Casework.Verify.Host`.
#
# Ports: 5442 for PostgreSQL — Time off holds 5440 and Invoicing 5441, and the three examples must be
# able to run at once. RabbitMQ takes 5672/15672, which nothing else in this repository claims.
#
# One server, two databases: each service owns its data, and a tenant with a dedicated database gets one
# on the same server. The server is shared because this is a developer's machine, not a
# deployment — nothing in the application knows the two databases are neighbours.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casework
      POSTGRES_USER: casework
      # The password of this local, disposable container, written in the hosts' appsettings.json so the
      # example runs as cloned. Not a secret and not what a deployment uses: that comes from its own
      # configuration, never from a committed file.
      POSTGRES_PASSWORD: Casework@Dev!
    ports:
      - "5442:5432"
    volumes:
      - casework-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework -d casework"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: casework
      RABBITMQ_DEFAULT_PASS: Casework@Dev!
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casework-data:
