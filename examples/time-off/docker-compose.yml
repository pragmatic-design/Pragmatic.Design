# What Time off needs to run: one PostgreSQL. `docker compose up -d`, then `dotnet run --project src/TimeOff.Host`.
# Port 5440, not 5432, so it does not collide with a PostgreSQL already running on the machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timeoff
      POSTGRES_USER: timeoff
      # The password of this local, disposable container, written in the host's appsettings.json so the
      # example runs as cloned. Not a secret and not what a deployment uses: that comes from its own
      # configuration, never from a committed file.
      POSTGRES_PASSWORD: TimeOff@Dev!
    ports:
      - "5440:5432"
    volumes:
      - timeoff-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeoff -d timeoff"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timeoff-data:
